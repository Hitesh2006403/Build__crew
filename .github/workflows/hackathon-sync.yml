name: Karnataka Hackathons Automated Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-hackathons:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BuildCrew Karnataka Hackathon Ingestion
        run: |
          API_URL="${{ secrets.BUILDCREW_API_URL || 'https://buildcrew.vercel.app' }}"
          SYNC_SECRET="${{ secrets.SYNC_SECRET || 'buildcrew_sync_secret_2026' }}"
          
          echo "Triggering automated hackathon sync at $API_URL/api/hackathons/sync-karnataka"
          curl -s -X POST "$API_URL/api/hackathons/sync-karnataka" \
            -H "Content-Type: application/json" \
            -H "x-sync-key: $SYNC_SECRET" \
            --fail || echo "Sync endpoint completed."
