name: Daily Hackathon Ingestion & Pruning

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC (07:30 AM IST)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-hackathons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Multi-Platform Ingestion & Expired Pruning
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://jhs498969_db_user:EQNjBRpNUYU06L1Y@buildcrewcluster.lexhqg2.mongodb.net/buildcrew_db?appName=BuildCrewCluster' }}
        run: |
          node -e '
            import("./services/ingestion/syncService.js").then(async ({ runHackathonIngestion }) => {
              const mongoose = (await import("mongoose")).default;
              await mongoose.connect(process.env.MONGODB_URI);
              const stats = await runHackathonIngestion();
              console.log("Daily GitHub Actions sync completed successfully:", stats);
              await mongoose.disconnect();
            }).catch((err) => {
              console.error("Daily sync failed:", err);
              process.exit(1);
            });
          '
